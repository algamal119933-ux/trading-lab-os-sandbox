<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trading Lab OS — Prototype v0.2.5 (static mock data, offline)</title>
<style>
:root{
  --bg:#0D131F;--panel:#131B2A;--raised:#1A2437;--line:#222D42;--line2:#33415C;
  --tx:#E7EBF3;--tx2:#A5B0C4;--tx3:#6E7A91;
  --ok:#3DBE82;--info:#5A9CF2;--warn:#E8A93A;--inc:#EF5A52;--stale:#B89A63;--unk:#9AA4B8;--off:#5B667C;
  --proto:#2A2413;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:"Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* The product is dark by Owner-approved direction; tokens are identical across viewer themes. */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D131F;--panel:#131B2A}}
:root[data-theme="dark"]{--bg:#0D131F;--panel:#131B2A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl] .app,[dir=rtl] .phone{font-family:var(--ar);font-size:15px;line-height:24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
.id{font-family:var(--mono);font-size:13px;unicode-bidi:isolate;direction:ltr}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx3)} .sec{color:var(--tx2)}

/* prototype controls — visually NOT product */
#proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--proto);border-bottom:1px dashed var(--stale);font-family:var(--sans);font-size:12px;line-height:16px;color:#E9DDBF;direction:ltr}
#proto b{font-weight:600}
#proto label{display:flex;gap:6px;align-items:center}
#proto select,#proto .pbtn{background:#3A321B;color:#F4EAD0;border:1px solid #6B5B30;border-radius:4px;padding:4px 8px;font:inherit}
#proto .pbtn:hover{background:#4A4024}
#proto .seg{display:inline-flex;border:1px solid #6B5B30;border-radius:4px;overflow:hidden}
#proto .seg button{padding:4px 10px;background:#3A321B}
#proto .seg button[aria-pressed=true]{background:#E9DDBF;color:#2A2413;font-weight:600}
#proto .note{margin-inline-start:auto;opacity:.8}

/* app shell */
.app{display:flex;flex-direction:column;height:calc(100% - 41px);min-height:600px}
.idbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(19,27,42,.88);backdrop-filter:blur(12px);flex-shrink:0}
.brand{font-weight:600;letter-spacing:.01em;white-space:nowrap}
.sep{width:1px;height:20px;background:var(--line2)}
.stagechip{display:flex;gap:6px;align-items:center;white-space:nowrap}
.stagechip:hover{color:var(--info)}
.mode{border:1px solid var(--info);color:var(--info);border-radius:2px;padding:0 6px;font-size:12px;font-weight:600;letter-spacing:.04em}
.lock{display:flex;gap:6px;align-items:center;color:var(--tx);white-space:nowrap}
.lock svg{color:var(--inc)}
.grow{flex:1}
.ownerind{white-space:nowrap}
.ownerind.req{color:var(--warn);font-weight:600}
.heart{font-size:12px;color:var(--tx3);white-space:nowrap}
.heart.st{color:var(--stale)}
.langt{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;font-size:12px}
.langt button{padding:2px 8px}.langt button[aria-pressed=true]{background:var(--raised);color:var(--tx)}
.truth{display:flex;height:36px;border-bottom:1px solid var(--line);background:rgba(19,27,42,.88);flex-shrink:0;overflow-x:auto}
.truth button{display:flex;align-items:center;gap:8px;padding:0 16px;border-inline-end:1px solid var(--line);white-space:nowrap;font-size:13px}
.truth button:hover{background:var(--raised)}
.truth .dl{color:var(--tx2)}
.body{display:flex;flex:1;min-height:0}
nav.side{width:232px;flex-shrink:0;border-inline-end:1px solid var(--line);padding:12px 8px;overflow-y:auto;display:flex;flex-direction:column}
.ng{margin:12px 8px 4px;font-size:12px;color:var(--tx3)}
.ni{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 10px;border-radius:6px;color:var(--tx2);text-align:start}
.ni:hover{background:var(--panel);color:var(--tx)}
.ni[aria-current=page]{background:var(--raised);color:var(--tx);box-shadow:inset 2px 0 0 var(--info)}
[dir=rtl] .ni[aria-current=page]{box-shadow:inset -2px 0 0 var(--info)}
.badge{font-size:11px;min-width:18px;text-align:center;border-radius:9px;padding:0 5px;background:var(--inc);color:#fff}
.badge.w{background:var(--warn);color:#1a1405}
.side .spacer{flex:1}
main{flex:1;overflow-y:auto;padding:20px 24px 48px;min-width:0}
.content.viewstale{filter:saturate(.35);opacity:.85}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.shead h1{font-size:20px;line-height:28px;font-weight:600;margin:0}
[dir=rtl] .shead h1{font-size:22px;line-height:32px}
.asof{font-size:12px;color:var(--tx3)}
.mocktag{font-size:11px;border:1px dashed var(--stale);color:var(--stale);padding:0 6px;border-radius:2px}

/* chips & glyphs */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:2px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip .age{font-weight:400;opacity:.85}
.g{font-size:11px;line-height:1}
.s-ok{color:var(--ok);background:rgba(61,190,130,.12);border-color:rgba(61,190,130,.35)}
.s-info,.s-rec,.s-act{color:var(--info);background:rgba(90,156,242,.12);border-color:rgba(90,156,242,.35)}
.s-warn,.s-owner{color:var(--warn);background:rgba(232,169,58,.12);border-color:rgba(232,169,58,.4)}
.s-inc,.s-fail,.s-fc,.s-blocked{color:var(--inc);background:rgba(239,90,82,.12);border-color:rgba(239,90,82,.4)}
.s-stale{color:var(--stale);background:rgba(184,154,99,.12);border-color:rgba(184,154,99,.4)}
.s-unk,.s-unver{color:var(--unk);background:transparent;border:1px dashed var(--unk)}
.s-off,.s-na,.s-wait{color:var(--tx2);background:transparent;border-color:var(--line2)}
.gl{display:inline-block;width:14px;text-align:center}
.gl.s-ok,.gl.s-info,.gl.s-rec,.gl.s-warn,.gl.s-inc,.gl.s-fail,.gl.s-stale,.gl.s-unk,.gl.s-unver,.gl.s-off,.gl.s-na,.gl.s-blocked,.gl.s-fc,.gl.s-owner,.gl.s-act,.gl.s-wait{background:none;border:0}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:10px;margin-bottom:16px;border:1px solid}
.banner .bg{font-size:14px;line-height:20px;padding-top:1px}
.banner p{margin:0}
.banner .bl{margin-inline-start:auto;white-space:nowrap;color:var(--tx);text-decoration:underline;text-underline-offset:3px}
.b-inc,.b-fc{background:rgba(239,90,82,.16);border-color:rgba(239,90,82,.5)}
.b-warn,.b-owner{background:rgba(232,169,58,.14);border-color:rgba(232,169,58,.5)}
.b-stale{background:rgba(184,154,99,.16);border-color:rgba(184,154,99,.55)}
.b-info{background:rgba(90,156,242,.12);border-color:rgba(90,156,242,.45)}
.b-inc .bg,.b-fc .bg{color:var(--inc)}.b-warn .bg,.b-owner .bg{color:var(--warn)}.b-stale .bg{color:var(--stale)}.b-info .bg{color:var(--info)}
.notice{display:flex;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line2);border-radius:6px;margin-bottom:16px;font-size:13px;color:var(--tx2)}
.notice button{margin-inline-start:auto;color:var(--info);text-decoration:underline;text-underline-offset:3px}

/* surfaces */
.verdict{display:grid;grid-template-columns:1fr 360px;background:var(--raised);border:1px solid var(--line2);border-radius:6px;margin-bottom:16px}
.verdict .vl{padding:18px 20px}
.vs{font-size:22px;line-height:30px;font-weight:500;margin:0 0 8px}
[dir=rtl] .vs{font-size:24px;line-height:36px}
.vn{color:var(--tx2);margin:0 0 6px}
.slots{border-inline-start:1px solid var(--line2);display:flex;flex-direction:column}
.slot{padding:12px 16px;flex:1}
.slot+.slot{border-top:1px solid var(--line2)}
.slot .sl{font-size:12px;color:var(--tx3);margin-bottom:2px}
.slot.req{background:rgba(232,169,58,.16)}
.slot.req .sl{color:var(--warn);font-weight:600}
.slot.inf{box-shadow:inset 0 0 0 1px rgba(90,156,242,.45)}
.band{display:grid;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.band.c3{grid-template-columns:1fr 1fr 1fr}
.band.c32{grid-template-columns:1.5fr 1fr .8fr}
.band.c2{grid-template-columns:1fr 1fr}
.band.c1{grid-template-columns:1fr}
.col{padding:14px 16px;min-width:0}
.col+.col{border-inline-start:1px solid var(--line)}
.ptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px}
.ptitle button{font-weight:600}
.ptitle button:hover{color:var(--info)}
.ptitle .asof{font-weight:400}
.row{display:grid;grid-template-columns:minmax(90px,38%) 1fr;align-items:center;gap:8px;min-height:30px;padding:2px 6px;margin:0 -6px;border-radius:4px;width:calc(100% + 12px);text-align:start}
button.row:hover{background:var(--raised)}
.row .k{color:var(--tx2);font-size:13px}
.row .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.row .v .a{color:var(--tx3);font-size:12px}
.row.unv .v{outline:1px dashed var(--unk);outline-offset:2px;border-radius:2px}
.row.stl .v{opacity:.65}
.bandlabel{font-size:12px;color:var(--tx3);margin:4px 2px 6px}
.pipe{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ps{flex:1;min-width:76px;border:1px solid var(--line2);border-radius:4px;padding:6px 8px;font-size:12px}
.ps .pn{color:var(--tx3)}
.ps.nr{border-style:dashed;opacity:.6}
.ps.vt{border-color:rgba(239,90,82,.5)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px;position:relative}
.bar i{display:block;height:100%;background:var(--tx2)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
.big{font-size:22px;font-weight:500}
.perf{opacity:.8}
.perf .cap{font-size:12px;color:var(--tx3)}

/* ribbon & continuity */
.ribbon{display:flex;gap:0;align-items:stretch;margin-bottom:16px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.ribbon button{flex:1;padding:10px 14px;text-align:start;border-inline-end:1px solid var(--line)}
.ribbon button:last-child{border:0}
.ribbon button:hover{background:var(--raised)}
.ribbon .rt{font-weight:600}
.ribbon .rs{font-size:12px;color:var(--tx2);margin-top:2px}
.ribbon .cur{background:var(--raised);box-shadow:inset 0 -2px 0 var(--info)}
.resume{background:var(--raised);border:1px solid var(--line2);border-radius:6px;margin-bottom:16px}
.resume .rh{padding:14px 20px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.resume .rh h2{font-size:14px;margin:0;color:var(--tx2);font-weight:600}
.resume .rv{padding:0 20px 12px}
.rgrid{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;padding:0 20px 14px}
[dir=rtl] .rgrid{grid-template-columns:200px 1fr}
.rgrid .k{color:var(--tx2);font-size:13px}
.rslots{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2)}
.rslots .slot+.slot{border-top:0;border-inline-start:1px solid var(--line2)}
.forb{padding:12px 20px;border-top:1px solid var(--line2);display:grid;grid-template-columns:180px 1fr;gap:16px}
[dir=rtl] .forb{grid-template-columns:200px 1fr}
.forb ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.forb li{font-size:12px;border:1px solid rgba(239,90,82,.35);color:var(--tx);padding:1px 8px;border-radius:2px}
.forb li::before{content:"⊘ ";color:var(--inc)}
.ract{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line2)}
.btn2{border:1px solid var(--line2);border-radius:4px;padding:6px 12px;background:var(--panel)}
.btn2:hover{border-color:var(--info)}
.cps .col .big{font-size:15px;font-weight:500;margin:4px 0}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:120px 20px 1fr auto;gap:8px;align-items:center;padding:5px 0}
.tl li .t{font-family:var(--mono);font-size:12px;color:var(--tx2);direction:ltr;unicode-bidi:isolate;text-align:start}
.tl li .src{font-size:12px;color:var(--tx3)}
.tl li.gap{display:block;margin:4px 0;padding:8px 12px;border-radius:4px;color:var(--stale);background:repeating-linear-gradient(45deg,rgba(184,154,99,.14) 0 8px,transparent 8px 16px);border:1px dashed rgba(184,154,99,.5);font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--tx3);font-size:12px;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--raised)}
td.r,th.r{text-align:end}
.twrap{overflow-x:auto}

/* inspector */
aside.insp{width:420px;flex-shrink:0;border-inline-start:1px solid var(--line2);background:var(--raised);overflow-y:auto;padding:16px 20px}
.ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ihead h2{font-size:16px;margin:0}
.ihead button{font-size:18px;color:var(--tx2);width:32px;height:32px}
.prov{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;padding:12px 0;border-top:1px solid var(--line2)}
.prov .k{color:var(--tx3)}
.itag{font-size:12px;color:var(--tx3);margin-top:12px}

/* ops */
.op{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.op .od{font-size:13px;color:var(--tx2)}
.emerg{margin-top:28px;border:1px solid rgba(239,90,82,.5);border-radius:10px;padding:16px}
.emerg h2{font-size:15px;margin:0 0 6px;color:var(--inc)}
.board .brow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.board .brow .bn{font-weight:500}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line2);border-radius:14px;padding:2px 10px;font-size:12px;color:var(--tx2)}
.filters button[aria-pressed=true]{background:var(--raised);color:var(--tx);border-color:var(--info)}
.nb{padding:28px;border:1px dashed var(--line2);border-radius:6px;color:var(--tx2)}
svg.chart{width:100%;height:auto;display:block}

/* phone */
.devwrap{display:flex;justify-content:center;padding:24px;overflow:auto;height:calc(100% - 41px)}
.phone{width:390px;height:844px;flex-shrink:0;border:1px solid var(--line2);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 8px #070b13}
.mbar{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font-size:13px}
.mglyph{display:flex;gap:10px;align-items:center;padding:4px 14px 10px;border-bottom:1px solid var(--line);font-size:13px}
.mscroll{flex:1;overflow-y:auto;padding:12px 14px}
.mtabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2);background:var(--panel)}
.mtabs button{padding:10px 0 12px;font-size:12px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.mtabs button[aria-current=page]{color:var(--tx);box-shadow:inset 0 2px 0 var(--info)}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.mgrid>div{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;border-bottom:1px solid var(--line)}
.mgrid>div:nth-child(odd){border-inline-end:1px solid var(--line)}
.mlist button{display:flex;justify-content:space-between;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:start}
.phone .banner{padding:10px 12px;font-size:13px;line-height:18px}
.phone .vs{font-size:18px;line-height:26px}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);padding:8px 14px;border-radius:6px;font-size:13px}

@media (max-width:1100px){nav.side{width:64px}nav.side .ng,nav.side .lbl{display:none}.band.c3,.band.c32{grid-template-columns:1fr 1fr}.verdict{grid-template-columns:1fr}.slots{border-inline-start:0;border-top:1px solid var(--line2)}}
@media (max-width:760px){.band.c3,.band.c32,.band.c2{grid-template-columns:1fr}.col+.col{border-inline-start:0;border-top:1px solid var(--line)}.rgrid,.forb{grid-template-columns:1fr}.rslots{grid-template-columns:1fr}.ribbon{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v0.2 consolidation additions ===== */
html,body{height:100%}
body{display:flex;flex-direction:column}
#proto{flex-shrink:0}
#root{flex:1;min-height:0}
.app{height:100%;min-height:600px;position:relative}
.devwrap{height:100%}
.pban{flex-shrink:0;padding:4px 16px;font-size:11px;line-height:16px;letter-spacing:.06em;font-weight:600;color:#E9DDBF;background:repeating-linear-gradient(135deg,#2A2413 0 10px,#231E10 10px 20px);border-bottom:1px dashed var(--stale);text-align:center}
[dir=rtl] .pban{letter-spacing:0;font-size:12px}
.phone .pban{font-size:10px;line-height:14px;padding:4px 10px}
.sit{background:var(--raised);border:1px solid var(--line2);border-radius:6px;margin-bottom:16px}
.sit .vl{padding:18px 20px 14px}
.slots4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2)}
.slots4 .slot+.slot{border-top:0;border-inline-start:1px solid var(--line2)}
.slot.nx{background:rgba(90,156,242,.06)}
.fc{font-size:11px;color:var(--info);border:1px solid rgba(90,156,242,.4);padding:0 5px;border-radius:2px;margin-inline-start:4px;font-weight:400}
.lad{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.lad li{display:flex;flex-direction:column;gap:2px;padding:6px 8px 0;border-top:2px solid var(--line2);font-size:12px;line-height:16px;color:var(--tx3)}
.lad li.done{border-top-color:var(--tx3);color:var(--tx2)}
.lad li.cur{border-top-color:var(--info);color:var(--tx);font-weight:600}
.lad li.cur.own{border-top-color:var(--warn)}
.lad .lg{font-size:11px}
.lad.full{margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px 10px}
.lad.full li{font-size:13px;line-height:18px;padding:10px 10px 0}
.lad .obs{font-weight:400;font-size:12px;color:var(--tx2)}
.exrow{display:grid;grid-template-columns:16px auto 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:start;padding:8px 6px;border-radius:4px;border-bottom:1px solid var(--line);font-size:13px}
.exrow:hover{background:var(--raised)}
.exrow .ol{color:var(--info);font-size:12px}
.quiet{color:var(--tx2);margin:0;font-size:13px}

function candles(){let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;let p=100,out='';const n=56,w=880,h=260,cw=w/n;const bars=[];
 for(let i=0;i<n;i++){const o=p,c=o+(r()-.48)*3,hi=Math.max(o,c)+r()*1.6,lo=Math.min(o,c)-r()*1.6;bars.push([o,c,hi,lo]);p=c}
 const mx=Math.max(...bars.map(v=>v[2])),mn=Math.min(...bars.map(v=>v[3])),Y=v=>12+(mx-v)/(mx-mn)*(h-24);
 for(let g=0;g<5;g++){const y=12+g*(h-24)/4;out+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
 bars.forEach((v,i)=>{const X=i*cw+cw/2,up=v[1]>=v[0];out+=`<line x1="${X}" x2="${X}" y1="${Y(v[2])}" y2="${Y(v[3])}" stroke="var(--tx3)"/><rect x="${X-cw*.3}" y="${Y(Math.max(v[0],v[1]))}" width="${cw*.6}" height="${Math.max(1,Math.abs(Y(v[0])-Y(v[1])))}" fill="${up?'none':'var(--tx3)'}" stroke="${up?'var(--tx2)':'var(--tx3)'}"/>`});
 const mi=50,mX=mi*cw+cw/2;out+=`<path d="M${mX-6} ${h-4} L${mX+6} ${h-4} L${mX} ${h-14}Z" fill="var(--warn)"/><text x="${mX+10}" y="${h-6}" fill="var(--tx2)" font-size="11" font-family="var(--sans)">HOLD</text>`;
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${x('Candle chart, DEMO data','رسم الشموع، بيانات تجريبية')}">${out}</svg>`}

 if(k==='restart'||k==='recovering'||k==='reconFail')return 'unver';if(k==='closedFail')return 'fail';
 if(s.step>=3&&!s.pos.length)return 'zero';return 'normal'}
function riskMetric(w){const m=riskMode(),V={exp:'18%',loss:'0.4%',veto:'3'}[w],LK=x('last known','آخر قيمة معروفة');
 if(m==='normal')return {v:tm(V),c:''};
 if(m==='stale')return {v:`${LK} ${tm(V)}`,c:chip('stale','stale','38m')};
 if(m==='unknown')return {v:`<span class="muted">${LK} ${tm(V)} · ${D('01:01')}</span>`,c:chip('unk','unknown')};
 if(m==='degraded')return w==='veto'?{v:tm(V),c:''}:{v:`${x('last valued','آخر تقييم')} ${tm(V)}`,c:chip('unver',b('Unverified · price stale','غير متحقق · السعر قديم'))};
 if(m==='unver')return {v:`${LK} ${tm(V)}`,c:chip('unver','unverified')};
 if(m==='zero')return w==='exp'?{v:tm('0%'),c:chip('ok',b('No open positions','لا مراكز مفتوحة'))}:{v:'—',c:chip('off',b('Not applicable · runtime stopped','لا ينطبق · التشغيل متوقف'))};
 return {v:'',c:chip('unver','asRecord')}}
function metricRow(w,label,lim){const r=riskMetric(w);return row(label,`${r.v}${lim&&riskMode()==='normal'?` <span class="a">/ ${lim}</span>`:''} ${r.c}`)}
function expoTxt(){const e=riskMetric('exp');return `${e.v} ${e.c}`}
function riskCol(){const m=riskMode(),e=riskMetric('exp');
 return `<div class="col"><div class="ptitle"><button data-go="risk">${x('Risk & exposure','المخاطر والانكشاف')}</button></div><div class="sec small">${x('Current exposure','الانكشاف الحالي')}</div><div class="big num">${e.v} <span class="muted" style="font-size:13px">/ 40% ${x('cap','الحد')}</span></div>${e.c?`<div>${e.c}</div>`:''}${m==='normal'?'<div class="bar"><i style="width:45%"></i></div>':''}${metricRow('loss',x('Daily loss','الخسارة اليومية'),'2.0%')}${metricRow('veto',x('Vetoes (24h)','الاعتراضات (24 س)'))}</div>`}
function posTrust(){const k=S.scenario,s=sc();
 if(k==='viewStale')return chip('stale',b('Last known','آخر حالة معروفة'),'38m');if(k==='unknown')return chip('unk','unknown');if(k==='closedFail')return chip('unver','asRecord');
 return s.posUnv?chip('unver','unverified'):chip('ok',b('Verified','متحقق'))}
function pnlCell(p){const k=S.scenario;
 if(k==='viewStale')return `<span class="muted">${x('last known','آخر قيمة معروفة')} ${tm(p.pnl)}</span> ${chip('stale','stale','38m')}`;
 if(k==='degraded')return chip('stale',b('Price stale','السعر قديم'),'14m');
 if(k==='unknown')return chip('unk','unknown');
 if(sc().posUnv)return chip('unver','unverified');
 return tm(p.pnl)}
function posCol(){const s=sc(),k=S.scenario;const h=`<div class="ptitle"><button data-go="trades">${x('Open positions','المراكز المفتوحة')}</button></div>`;
 if(k==='closedFail')return `<div class="col">${h}<p class="quiet">${chip('unver','asRecord')}</p></div>`;
 const cnt=s.pos.length?x(`${s.pos.length} open`,`${s.pos.length} مفتوح`):x('None open','لا مراكز مفتوحة');
 return `<div class="col">${h}<div class="sec">${k==='viewStale'||k==='unknown'?`${x('Last known','آخر حالة معروفة')}: ${cnt}`:cnt}</div>${s.pos.map(q=>{const p=POS[q];return `<button class="row" data-insp="pos:${q}" style="grid-template-columns:1fr"><span class="v">${id(p.pair)} · ${L(p.side)} · ${x('risk','مخاطرة')} ${tm(p.risk)} ${posTrust()}</span></button>`}).join('')}</div>`}
function decCol(){const s=sc();const t=`<button data-go="decisions">${x('Latest decision','آخر قرار')}</button>`;
 if(s.dec.none)return `<div class="col"><div class="ptitle">${t}</div><p class="quiet">${L(s.dec.none)}</p></div>`;
 const d=lastDec();
 return `<div class="col"><div class="ptitle">${t}<span class="asof">${D(d.t)}</span></div><button class="row ${s.dec.unv?'unv':''} ${s.dec.stale?'stl':''}" data-dec="${d.id}" style="grid-template-columns:1fr"><span class="v">${chip(...d.o)} ${id(d.p)} ${s.dec.unv?chip('unver','unverified'):''} ${s.dec.stale?chip('stale',b('Last known','آخر حالة معروفة')):''}</span></button>${pipeMini(d.tr)}<div class="sec small">${x('Why','السبب')}: ${L(d.r)}</div></div>`}
function decisions(){const s=sc(),V=visDecs();const d=V.find(v=>v.id===S.dec)||lastDec();
 return `${bannerHTML()}${shead('decisions')}<section class="band" style="grid-template-columns:4fr 8fr"><div class="col twrap"><table><thead><tr><th>${x('Time','الوقت')}</th><th>${x('Pair','الزوج')}</th><th>${x('Outcome','النتيجة')}</th></tr></thead><tbody>${V.map(v=>`<tr class="click" data-dec="${v.id}" tabindex="0" ${v.id===d.id?'style="background:var(--raised)"':''}><td>${tm(v.t)}</td><td>${id(v.p)}</td><td>${chip(...v.o)}</td></tr>`).join('')}</tbody></table>${s.visDecs?`<p class="cd">${x('Only decisions observed before the last observation are listed.','تُعرض فقط القرارات المرصودة قبل آخر رصد.')}</p>`:''}</div>
 <div class="col"><div class="ptitle"><span>${x('Decision / Execution Trace','مسار القرار / التنفيذ')} ${id(d.p)} · ${D(d.t)}</span>${s.dec.unv&&d.id===lastDec().id?chip('unver','unverified'):''}${s.dec.stale&&d.id===lastDec().id?chip('stale',b('Last known','آخر حالة معروفة')):''}</div>
 ${PIPE.map((p,i)=>`<div class="row" style="grid-template-columns:24px 150px 1fr;${d.tr[i][0]==='off'?'opacity:.55':''}"><span class="muted num">${i+1}</span><span class="k">${L(p)}</span><span class="v">${gl(d.tr[i][0])} ${L(d.tr[i][1])}${d.tr[i][0]==='off'?` <span class="a">${x('not reached','لم تُبلغ')}</span>`:''}</span></div>`).join('')}
 <p class="sec small">${x('Reason','السبب')}: ${L(d.r)}</p>${row(x('Market / Data Truth context','سياق حقيقة السوق / البيانات'),chip(...s.sys.feed))}${row(x('Evidence refs','مراجع الأدلة'),id('DEMO-DEC-'+d.id.toUpperCase()))}${row(x('Runtime / source identity','هوية التشغيل / المصدر'),id('DEMO-RUNTIME-A1B2C3'))}<p class="cd">${x('Per-stage outputs: UNKNOWN UNTIL SOURCE INVENTORY (depends on what the runtime logs).','مخرجات كل مرحلة: غير معروفة حتى جرد المصادر (تعتمد على ما يسجله التشغيل).')}</p></div></section>`}
function trades(){const s=sc(),k=S.scenario;const ex=CAPS.filter(c=>c.exec);
 const rows=k==='closedFail'?`<tr><td colspan="8">${chip('unver','asRecord')}</td></tr>`:s.pos.length?s.pos.map(q=>{const p=POS[q];return `<tr class="click" data-insp="pos:${q}" tabindex="0"><td>${id(p.pair)}</td><td>${L(p.side)}</td><td>${posTrust()}</td><td>${id(p.size)}</td><td class="r">${id(p.entry)}</td><td>${tm(p.risk)}</td><td>${L(p.exit)}</td><td class="r">${pnlCell(p)}</td></tr>`}).join(''):`<tr><td colspan="8" class="sec">${x('No open positions.','لا مراكز مفتوحة.')}</td></tr>`;
 return `${bannerHTML()}${shead('trades')}
 <div class="capstrip"><span class="sec">${x('Execution capabilities','قدرات التنفيذ')}:</span>${ex.map(c=>`${L(c.k)} ${chip(...c.st)}`).join(' ')}<span class="cd">${x('rows supplied by authority truth','الصفوف مصدرها حقيقة الصلاحيات')}</span></div>
 <h2 class="bandlabel">${x('Open','المفتوحة')}</h2><section class="band c1"><div class="col twrap"><table><thead><tr><th>${x('Pair','الزوج')}</th><th>${x('Side','الاتجاه')}</th><th>${x('Verification','التحقق')}</th><th>${x('Size','الحجم')}</th><th class="r">${x('Entry','الدخول')}</th><th>${x('Risk at entry','المخاطرة عند الدخول')}</th><th>${x('Exit contract','عقد الخروج')}</th><th class="r">${x('PnL','الربح/الخسارة')}</th></tr></thead><tbody>${rows}</tbody></table>${k==='closedFail'?'':`<p class="cd">${x('PnL is shown as a number only when price and position truth are current and verified.','يظهر الربح/الخسارة رقمًا فقط عندما تكون حقيقة السعر والمركز حالية ومتحققًا منها.')}</p>`}</div></section>${closedTrades()}`}
function risk(){const m=riskMode(),s=sc(),e=riskMetric('exp');
 const posR=m==='fail'?chip('unver','asRecord'):m==='unknown'?`<span class="muted">${x('last known','آخر قيمة معروفة')} ${tm(String(s.pos.length))}</span> ${chip('unk','unknown')}`:m==='stale'?`${x('last known','آخر قيمة معروفة')} ${tm(String(s.pos.length))} ${chip('stale','stale','38m')}`:`${tm(String(s.pos.length))}${m==='unver'?' '+chip('unver','unverified'):''}`;
 return `${bannerHTML()}${shead('risk')}
 <section class="band c2"><div class="col"><div class="ptitle"><span>${x('Current state','الحالة الحالية')}</span><span class="asof">${x('follows the scenario’s trust state','تتبع حالة الثقة في الحالة المعروضة')}</span></div>${row(x('Current exposure','الانكشاف الحالي'),`${e.v} ${e.c}`)}${m==='normal'?'<div class="bar"><i style="width:45%"></i></div>':''}${metricRow('loss',x('Daily loss','الخسارة اليومية'))}${metricRow('veto',x('Vetoes (24h)','الاعتراضات (24 س)'))}${row(x('Open positions','المراكز المفتوحة'),posR)}</div>
 <div class="col"><div class="ptitle"><span>${x('Governed configuration','الإعداد المحكوم')}</span><span class="asof">${x('contract / config fact, not current state','حقيقة عقد / إعداد، وليست حالة حالية')}</span></div>${row(x('Exposure cap','حد الانكشاف'),tm('40%'))}${row(x('Daily loss limit','حد الخسارة اليومية'),tm('2.0%'))}${row(x('Risk per trade','المخاطرة لكل صفقة'),tm('0.5%'))}${row(x('Limits source','مصدر الحدود'),id('DEMO-RISK-CONFIG'))}</div></section>
 <h2 class="bandlabel">${x('Capability & Authority Matrix','مصفوفة القدرات والصلاحيات')}</h2>
 <section class="band c1"><div class="col twrap"><table><thead><tr><th>${x('Capability','القدرة')}</th><th>${x('State','الحالة')}</th><th>${x('Authority source','مصدر الصلاحية')}</th><th>${x('Since','منذ')}</th><th>${x('Expected relationship / preconditions','العلاقة المتوقعة / الشروط المسبقة')}</th></tr></thead><tbody>
 ${CAPS.map((c,i)=>`<tr class="click" data-insp="cap:${i}" tabindex="0"><td>${typeof c.k==='string'?id(c.k):L(c.k)}</td><td>${chip(...c.st)}</td><td>${typeof c.src==='string'?id(c.src):L(c.src)}</td><td>${c.since==='—'?'—':id(c.since)}</td><td class="sec">${L(c.pre)}</td></tr>`).join('')}</tbody></table>
 <p class="cd">${x('Rows come from authority truth, not from this layout. A new capability appears as a new row; an unreadable row shows Unknown and is treated as blocked.','الصفوف مصدرها حقيقة الصلاحيات لا هذا التصميم. تظهر أي قدرة جديدة كصف جديد؛ والصف غير المقروء يظهر غير معروف ويُعامل كمحظور.')}</p></div></section>`}
function chartState(){const k=S.scenario;
 if(k==='viewStale')return {cut:44,cls:'stale',t:b('Data ends 38 min ago · STALE · no bars or markers after this point','تنتهي البيانات قبل 38 دقيقة · قديمة · لا شموع ولا علامات بعد هذه النقطة')};
 if(k==='degraded')return {cut:50,cls:'stale',t:b('Data ends 14 min ago · STALE · no bars or markers after this point','تنتهي البيانات قبل 14 دقيقة · قديمة · لا شموع ولا علامات بعد هذه النقطة')};
 if(k==='unknown')return {cut:49,cls:'unk',t:b(`CURRENT MARKET STATE UNKNOWN · last observation ${D('01:01')} · chart shows last-known data only`,`حالة السوق الحالية غير معروفة · آخر رصد ${D('01:01')} · يعرض الرسم آخر بيانات معروفة فقط`)};
 return null}
function candles(){const cs=chartState();let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;let p=100,out='';const n=56,w=880,h=260,cw=w/n;const bars=[];
 for(let i=0;i<n;i++){const o=p,c=o+(r()-.48)*3,hi=Math.max(o,c)+r()*1.6,lo=Math.min(o,c)-r()*1.6;bars.push([o,c,hi,lo]);p=c}
 const mx=Math.max(...bars.map(v=>v[2])),mn=Math.min(...bars.map(v=>v[3])),Y=v=>12+(mx-v)/(mx-mn)*(h-24);const cut=cs?cs.cut:n;
 for(let g=0;g<5;g++){const y=12+g*(h-24)/4;out+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
 bars.forEach((v,i)=>{if(i>=cut)return;const X=i*cw+cw/2,up=v[1]>=v[0];out+=`<line x1="${X}" x2="${X}" y1="${Y(v[2])}" y2="${Y(v[3])}" stroke="var(--tx3)"/><rect x="${X-cw*.3}" y="${Y(Math.max(v[0],v[1]))}" width="${cw*.6}" height="${Math.max(1,Math.abs(Y(v[0])-Y(v[1])))}" fill="${up?'none':'var(--tx3)'}" stroke="${up?'var(--tx2)':'var(--tx3)'}"/>`});
 const mi=50;if(mi<cut){const mX=mi*cw+cw/2;out+=`<path d="M${mX-6} ${h-4} L${mX+6} ${h-4} L${mX} ${h-14}Z" fill="var(--warn)"/><text x="${mX+10}" y="${h-6}" fill="var(--tx2)" font-size="11" font-family="var(--sans)">HOLD</text>`}
 if(cs){const X0=cut*cw;out+=`<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--line2)" stroke-width="3"/></pattern></defs><rect x="${X0}" y="0" width="${w-X0}" height="${h}" fill="url(#hatch)" opacity=".7"/><line x1="${X0}" x2="${X0}" y1="0" y2="${h}" stroke="var(--${cs.cls==='unk'?'unk':'stale'})" stroke-dasharray="4 3"/>`}
 const svg=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${x('Candle chart, DEMO data','رسم الشموع، بيانات تجريبية')}">${out}</svg>`;
 return `<div class="chartwrap ${cs&&cs.cls==='unk'?'unkchart':''}">${svg}${cs?`<div class="chartov s-${cs.cls}" dir="${S.lang==='ar'?'rtl':'ltr'}" role="status">${gl(cs.cls)} ${L(cs.t)}</div>`:''}</div>`}
function market(){const cs=chartState();
 return `${bannerHTML()}${shead('market')}
 <section class="band c1"><div class="col">
 <div class="capstrip"><span class="sec">${x('Pair','الزوج')}</span><span class="tfs">${MKT.pairs.map(p=>`<button data-pair="${p}" aria-pressed="${S.pair===p}">${id(p)}</button>`).join('')}</span><span class="sep"></span>
 <span class="sec">${x('Timeframe','الإطار الزمني')}</span><span class="tfs">${MKT.timeframes.map(t=>`<button data-tf="${t}" aria-pressed="${S.tf===t}">${tm(t)}</button>`).join('')}</span><span class="mocktag">DEMO</span></div>
 <p class="cd" style="margin:0 0 8px">${x('Pairs, timeframes and data capabilities are rendered from the market capability contract. These are DEMO values, not product requirements.','الأزواج والأطر الزمنية وقدرات البيانات تُعرض من عقد قدرات السوق. هذه قيم تجريبية وليست متطلبات للمنتج.')}</p>
 ${candles()}</div></section>
 <section class="band c2"><div class="col"><div class="ptitle"><span>${x('Market / Data Truth · capabilities','حقيقة السوق / البيانات · القدرات')}</span><span class="asof">${x('upstream of the Decision / Execution Trace','منبع مسار القرار / التنفيذ')}</span></div>${MKT.caps.map(c=>row(L(c[0]),chip(c[1],c[2]))).join('')}</div>
 <div class="col"><div class="ptitle"><span>${x('Context','السياق')}</span>${cs?chip(cs.cls,cs.cls==='unk'?'unknown':'stale'):''}</div>${row(x('Data age','عمر البيانات'),chip(...sc().sys.feed))}${row(x('Regime','نظام السوق'),chip('unk','unkInv'))}${row(x('Volatility','التذبذب'),chip('unk','unkInv'))}${row(x('Liquidity','السيولة'),chip('unk','unkInv'))}${row(x('Higher-timeframe context','سياق الإطار الأعلى'),chip('unk','unkInv'))}<p class="cd">${x('Neutral candles by design: colour is reserved for system state.','شموع محايدة عمدًا: اللون محجوز لحالة النظام.')}</p></div></section>`}
