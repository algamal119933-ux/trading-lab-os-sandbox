name: Dataset V2 research

# The cloud sandbox cannot reach Binance (the egress policy answers 403 to
# CONNECT for every Binance host), so real market data is acquired here, on a
# GitHub-hosted runner, from Binance's public REST API. No exchange credential
# is used or required: download-data and backtesting read public market data,
# and dry_run stays true throughout.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which research stage to run
        type: choice
        default: acquire-and-audit
        options:
          - probe-only
          - acquire-and-audit
          - passive-benchmarks
          - baseline-development
          - baseline-validation
      force_redownload:
        description: Ignore the cached dataset and download again
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  IMAGE: freqtradeorg/freqtrade:2026.7
  DATA_DIR: freqtrade/user_data/data/binance
  LOCK: research/datasets/dataset_v2.lock.json
  ACQUIRE_TIMERANGE: "20201201-20260901"
  DEV_TIMERANGE: "20210101-20250101"
  VAL_TIMERANGE: "20250101-20260901"
  DEV_START: "2021-01-01T00:00:00Z"
  DEV_END: "2024-12-31T23:59:59Z"
  VAL_START: "2025-01-01T00:00:00Z"
  VAL_END: "2026-08-31T23:59:59Z"
  EXPECT_START: "2020-12-01T00:00:00Z"
  EXPECT_END_EXCLUSIVE: "2026-09-01T00:00:00Z"
  STRATEGY: BaselineEmaRegimeV1
  WALLET: "100"
  FEE: "0.001"

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-research.txt

      - name: Create the runtime and research configs, and guard both
        run: |
          set -euo pipefail
          cp freqtrade/user_data/config.paper.json.example freqtrade/user_data/config.json
          python3 scripts/paper_guard.py --config freqtrade/user_data/config.json
          # The research config is the paper config plus the data-mirror overlay,
          # merged here so a single file reaches Freqtrade and the guard checks
          # exactly what the engine will read.
          python3 - <<'PY'
          import copy, json, pathlib
          def merge(base, overlay):
              out = copy.deepcopy(base)
              for k, v in overlay.items():
                  if k.startswith("_"):
                      continue
                  out[k] = merge(out[k], v) if isinstance(v, dict) and isinstance(out.get(k), dict) else v
              return out
          base = json.loads(pathlib.Path("freqtrade/user_data/config.paper.json.example").read_text())
          overlay = json.loads(pathlib.Path("freqtrade/user_data/config.binance-data-mirror.json.example").read_text())
          pathlib.Path("freqtrade/user_data/config.research.json").write_text(
              json.dumps(merge(base, overlay), indent=2) + "\n")
          PY
          python3 scripts/paper_guard.py --config freqtrade/user_data/config.research.json

      - name: Make the mounted paths writable by the image's own user
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR" artifacts freqtrade/user_data/backtest_results \
                   freqtrade/user_data/logs
          # The Freqtrade image runs as ftuser (uid 1000); the runner is 1001.
          chmod -R a+rwX freqtrade/user_data artifacts

      - name: Pull the pinned Freqtrade image
        if: inputs.stage != 'probe-only'
        run: docker pull "$IMAGE"

      - name: Endpoint reachability report
        run: |
          set -uo pipefail
          mkdir -p artifacts
          python3 - <<'PY' | tee artifacts/endpoint_report.txt
          import urllib.request, urllib.error, time
          BASE = "https://data.binance.vision"
          targets = [
              ("trading-api",   "https://api.binance.com/api/v3/exchangeInfo"),
              ("data-api",      "https://data-api.binance.vision/api/v3/exchangeInfo"),
              ("data-api-kline","https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1"),
              ("monthly-1h",    f"{BASE}/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2021-01.zip"),
              ("monthly-1h-sum",f"{BASE}/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2021-01.zip.CHECKSUM"),
              ("monthly-5m",    f"{BASE}/data/spot/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-2021-01.zip"),
              ("monthly-5m-eth",f"{BASE}/data/spot/monthly/klines/ETHUSDT/5m/ETHUSDT-5m-2021-01.zip"),
              ("monthly-5m-last",f"{BASE}/data/spot/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-2026-08.zip"),
              ("monthly-1h-2020",f"{BASE}/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2020-12.zip"),
              ("daily-1h",      f"{BASE}/data/spot/daily/klines/BTCUSDT/1h/BTCUSDT-1h-2026-08-30.zip"),
          ]
          for name, url in targets:
              started = time.time()
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      body = r.read()
                  status, size = r.status, len(body)
              except urllib.error.HTTPError as e:
                  status, size = e.code, 0
              except Exception as e:
                  status, size = f"ERR:{type(e).__name__}", 0
              print(f"{name:<18} {str(status):<8} {size:>10} bytes  {time.time()-started:5.2f}s  {url}")
          PY

      - name: Probe public Binance data endpoints
        if: inputs.stage != 'probe-only' 
        # api.binance.com answers 451 (geo-restriction) to GitHub-hosted runners.
        # These are Binance's own public market-data endpoints, which serve the
        # same spot klines without the trading-API eligibility check.
        run: |
          set -uo pipefail
          mkdir -p artifacts
          probe() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$2" || echo "000")
            printf '%-24s %-4s %s\n' "$1" "$code" "$2"
          }
          {
            probe trading-api   "https://api.binance.com/api/v3/exchangeInfo"
            probe data-api      "https://data-api.binance.vision/api/v3/exchangeInfo"
            probe data-api-kl   "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1"
            probe archive-1h    "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2021-01.zip"
            probe archive-5m    "https://data.binance.vision/data/spot/monthly/klines/ETHUSDT/5m/ETHUSDT-5m-2021-01.zip"
            probe archive-chk   "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2021-01.zip.CHECKSUM"
          } | tee artifacts/endpoint_probe.txt

      - name: Restore the Dataset V2 market-data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: freqtrade/user_data/data
          key: dataset-v2-binance-spot-btc-eth-5m-1h-20201201-20260901

      - name: Acquire Binance spot klines from the public data archive
        # api.binance.com answers 451 to this runner, so ccxt/download-data cannot
        # even load markets. Binance publishes the same spot klines as checksummed
        # ZIP archives on data.binance.vision, with no eligibility check. This is
        # real exchange data, not a synthetic substitute.
        if: inputs.stage != 'probe-only' && (steps.data-cache.outputs.cache-hit != 'true' || inputs.force_redownload)
        run: |
          set -euo pipefail
          python3 scripts/fetch_binance_public_data.py \
            --symbol BTCUSDT --symbol ETHUSDT \
            --timeframe 1h --timeframe 5m \
            --start 2020-12-01 --end 2026-08-31 \
            --out-dir "$DATA_DIR" \
            --manifest artifacts/acquisition_manifest.json
          ls -la "$DATA_DIR"

      - name: Deep audit and dual fingerprints
        if: inputs.stage != 'probe-only'
        run: |
          set -euo pipefail
          python3 scripts/audit_data.py \
              --data-dir "$DATA_DIR" \
              --pair BTC/USDT --pair ETH/USDT \
              --timeframe 5m --timeframe 1h \
              --expect-start "$EXPECT_START" \
              --expect-end "$EXPECT_END_EXCLUSIVE" \
              --out artifacts/dataset_v2_audit.json \
            | tee artifacts/dataset_v2_audit.log || echo "AUDIT_EXIT=$?"
          # Surface the diagnosis regardless: a failing audit is the finding.
          python3 - <<'PY' | tee artifacts/dataset_v2_audit_summary.txt
          import json, pathlib
          report = json.loads(pathlib.Path("artifacts/dataset_v2_audit.json").read_text())
          print("overall_pass:", report["overall_pass"])
          for f in report["files"]:
              print(f"\n{f['pair']} {f['timeframe']}: pass={f.get('pass')} rows={f['rows']}")
              print("  range:", f.get("start"), "->", f.get("end"))
              print("  start_ok:", f.get("start_matches_expected"), "end_ok:", f.get("end_matches_expected"))
              print("  missing:", f.get("missing_intervals"),
                    "clusters:", f.get("gap_cluster_count"),
                    "largest:", f.get("largest_gap_candles"))
              print("  dupes:", f.get("duplicate_timestamps"),
                    "off_grid:", f.get("unexpected_timestamps"),
                    "nan:", f.get("nan_cells"),
                    "bad_ohlc:", f.get("bad_ohlc_rows"),
                    "monotonic:", f.get("monotonic_time"),
                    "last_complete:", f.get("last_candle_is_complete"))
              print("  RAW_FILE_SHA256      ", f.get("raw_file_sha256"))
              print("  CANONICAL_CONTENT    ", f.get("canonical_candle_content_sha256"))
              for c in (f.get("gap_clusters") or [])[:12]:
                  print(f"    gap {c['missing_candles']:>7} candles  {c['start']} -> {c['end']}")
          for a in report["aggregation_checks"]:
              print(f"\n{a['pair']} {a['fine_timeframe']}->{a['coarse_timeframe']}: pass={a['pass']} "
                    f"compared={a['common_complete_buckets']} incomplete={a['incomplete_fine_buckets_in_downloaded_range']} "
                    f"mismatches={a['mismatched_bars']}")
          print("\nrange_alignment:", json.dumps(report["range_alignment"]))
          PY

      - name: Can Freqtrade read the acquired data through the mirror?
        if: inputs.stage != 'probe-only'
        continue-on-error: true
        run: |
          set -uo pipefail
          docker run --rm \
            -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
            "$IMAGE" list-data \
              --config /freqtrade/user_data/config.research.json \
              --data-format-ohlcv feather \
            2>&1 | tail -30 | tee artifacts/freqtrade_list_data.log

      - name: Assert against the dataset lock once it is frozen
        if: inputs.stage != 'probe-only'
        run: |
          set -euo pipefail
          status="$(python3 -c "import json;print(json.load(open('$LOCK'))['status'])")"
          if [ "$status" = "frozen" ]; then
            python3 scripts/audit_data.py \
                --data-dir "$DATA_DIR" \
                --pair BTC/USDT --pair ETH/USDT \
                --timeframe 5m --timeframe 1h \
                --lock "$LOCK" | tee artifacts/dataset_v2_lock_check.log
          else
            echo "dataset lock status is '$status'; fingerprints are being established by this run"
          fi

      - name: Passive benchmarks on the frozen Development window
        if: inputs.stage != 'acquire-and-audit'
        run: |
          set -euo pipefail
          python3 freqtrade/user_data/baseline_benchmarks.py \
              --data-dir "$DATA_DIR" \
              --lock "$LOCK" \
              --period development \
              --fee "$FEE" \
              --wallet "$WALLET" --stake 10 --max-open-trades 2 \
              --out artifacts/passive_development.json \
            | tee artifacts/passive_development.log

      - name: Passive benchmarks on the Validation window
        if: inputs.stage == 'baseline-validation'
        run: |
          set -euo pipefail
          python3 freqtrade/user_data/baseline_benchmarks.py \
              --data-dir "$DATA_DIR" \
              --lock "$LOCK" \
              --period validation \
              --fee "$FEE" \
              --wallet "$WALLET" --stake 10 --max-open-trades 2 \
              --out artifacts/passive_validation.json \
            | tee artifacts/passive_validation.log

      - name: Freeze the code hashes being evaluated
        if: startsWith(inputs.stage, 'baseline-')
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          strategy = f"freqtrade/user_data/strategies/{os.environ['STRATEGY']}.py"
          import subprocess
          out = {
              "strategy_file": strategy,
              "strategy_sha256": sha(strategy),
              "config_example_sha256": sha("freqtrade/user_data/config.paper.json.example"),
              "effective_config_sha256": subprocess.check_output(
                  ["python3", "scripts/effective_config.py", "--hash-only",
                   "--config", "freqtrade/user_data/config.json"], text=True).strip(),
              "code_commit": os.environ["GITHUB_SHA"],
          }
          pathlib.Path("artifacts/frozen_hashes.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Backtest on Development (1h signals, 5m detail simulation)
        if: inputs.stage == 'baseline-development'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
            "$IMAGE" backtesting \
              --config /freqtrade/user_data/config.research.json \
              --strategy "$STRATEGY" \
              --strategy-path /freqtrade/user_data/strategies \
              --timerange "$DEV_TIMERANGE" \
              --timeframe-detail 5m \
              --enable-protections \
              --export trades \
              --export-filename /freqtrade/user_data/backtest_results/dev.json \
            2>&1 | tee artifacts/backtest_development.log
          # Freqtrade exits 0 on a configuration error, so check the output too.
          ! grep -qE 'CRITICAL - Invalid configuration|Configuration error' artifacts/backtest_development.log

      - name: Backtest on Validation (single unchanged run)
        if: inputs.stage == 'baseline-validation'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
            "$IMAGE" backtesting \
              --config /freqtrade/user_data/config.research.json \
              --strategy "$STRATEGY" \
              --strategy-path /freqtrade/user_data/strategies \
              --timerange "$VAL_TIMERANGE" \
              --timeframe-detail 5m \
              --enable-protections \
              --export trades \
              --export-filename /freqtrade/user_data/backtest_results/val.json \
            2>&1 | tee artifacts/backtest_validation.log
          ! grep -qE 'CRITICAL - Invalid configuration|Configuration error' artifacts/backtest_validation.log

      - name: Lookahead analysis (Development)
        if: inputs.stage == 'baseline-development'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
            "$IMAGE" lookahead-analysis \
              --config /freqtrade/user_data/config.research.json \
              --strategy "$STRATEGY" \
              --strategy-path /freqtrade/user_data/strategies \
              --timerange "$DEV_TIMERANGE" \
            2>&1 | tee artifacts/lookahead_development.log

      - name: Recursive analysis (Development)
        if: inputs.stage == 'baseline-development'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
            "$IMAGE" recursive-analysis \
              --config /freqtrade/user_data/config.research.json \
              --strategy "$STRATEGY" \
              --strategy-path /freqtrade/user_data/strategies \
              --timerange "$DEV_TIMERANGE" \
              -p BTC/USDT \
            2>&1 | tee artifacts/recursive_development.log

      - name: Normalise backtest metrics
        if: startsWith(inputs.stage, 'baseline-')
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in freqtrade/user_data/backtest_results/*.json; do
            echo "=== $f ==="
            python3 research/summarize_backtest.py --result "$f" --dump-schema || true
          done
          if [ "${{ inputs.stage }}" = "baseline-development" ]; then
            RESULT=freqtrade/user_data/backtest_results/dev.json
            python3 research/summarize_backtest.py \
              --result "$RESULT" \
              --window-start "$DEV_START" --window-end "$DEV_END" \
              --wallet "$WALLET" --fee "$FEE" \
              --passive artifacts/passive_development.json \
              --out artifacts/metrics_development.json \
              --md artifacts/metrics_development.md
            cat artifacts/metrics_development.md
          else
            RESULT=freqtrade/user_data/backtest_results/val.json
            python3 research/summarize_backtest.py \
              --result "$RESULT" \
              --window-start "$VAL_START" --window-end "$VAL_END" \
              --wallet "$WALLET" --fee "$FEE" \
              --passive artifacts/passive_validation.json \
              --out artifacts/metrics_validation.json \
              --md artifacts/metrics_validation.md
            cat artifacts/metrics_validation.md
          fi

      - name: Collect raw engine output
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/backtest_results
          cp -r freqtrade/user_data/backtest_results/. artifacts/backtest_results/ 2>/dev/null || true
          ls -laR artifacts | head -60
          # Artifact blob storage is unreachable from the analysis environment, so
          # the job log is the delivery channel. Re-print the key evidence last.
          echo "===== ENDPOINT REPORT ====="; cat artifacts/endpoint_report.txt 2>/dev/null || echo "(none)"
          echo "===== ENDPOINT PROBE ====="; cat artifacts/endpoint_probe.txt 2>/dev/null || echo "(none)"
          echo "===== FREQTRADE list-data ====="; cat artifacts/freqtrade_list_data.log 2>/dev/null || echo "(none)"
          echo "===== AUDIT SUMMARY ====="; cat artifacts/dataset_v2_audit_summary.txt 2>/dev/null || echo "(none)"
          echo "===== ACQUISITION MANIFEST (summary) ====="
          python3 - <<'PY' 2>/dev/null || echo "(none)"
          import json, pathlib
          m = json.loads(pathlib.Path("artifacts/acquisition_manifest.json").read_text())
          print("source:", m["source"], "| checksum verification:", m["checksum_verification"])
          print("archives:", len(m["archives"]),
                "| verified:", sum(1 for a in m["archives"] if a.get("checksum_verified")))
          for f in m["files_written"]:
              print(" ", f)
          PY
          echo "===== FROZEN HASHES ====="; cat artifacts/frozen_hashes.json 2>/dev/null || echo "(none)"
          echo "===== PASSIVE (development) ====="; cat artifacts/passive_development.json 2>/dev/null || echo "(none)"
          echo "===== PASSIVE (validation) ====="; cat artifacts/passive_validation.json 2>/dev/null || echo "(none)"
          echo "===== METRICS (development) ====="; cat artifacts/metrics_development.json 2>/dev/null || echo "(none)"
          echo "===== METRICS (validation) ====="; cat artifacts/metrics_validation.json 2>/dev/null || echo "(none)"
          echo "===== LOOKAHEAD (tail) ====="; tail -30 artifacts/lookahead_development.log 2>/dev/null || echo "(none)"
          echo "===== RECURSIVE (tail) ====="; tail -30 artifacts/recursive_development.log 2>/dev/null || echo "(none)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-v2-${{ inputs.stage }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
