name: H1 paper-readiness qualification (H1-PAPER-READINESS-QUALIFICATION-1)

# Runs the preregistered TRIAL-H1-QUAL-1 diagnostic campaign against the
# frozen H1_EMACROSS identity: 8 parameter-sensitivity neighbors, 4
# temporal-stability slices, 1 cost-stress adverse-fee run. The center
# configuration (ema_period=600, exit_threshold=2.0) on the full window at
# base fee is NOT re-run: it is TRIAL-H1-CD1, already canonical.
#
# Reuses extbench.yml's exact upstream-pin/materialise mechanism (no new
# fetch path) and its acquisition/data-lock/warm-up steps verbatim.
#
# workflow_dispatch only from the outset.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "h1-qualification/run/**"

permissions:
  contents: read

concurrency:
  group: h1-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: freqtradeorg/freqtrade:2026.7
  DATA_DIR: freqtrade/user_data/data/binance
  CACHE_DIR: dataset-cache/binance
  OVERLAY_DIR: overlay-data/binance
  STRATEGY_DIR: freqtrade/user_data/strategies
  FIRST_SCORED_UTC: "2021-01-01T00:00:00Z"

jobs:
  qualification:
    name: H1 qualification diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "pandas==2.2.3" "pyarrow==18.1.0"

      # ---- reuse extbench.yml's exact upstream-pin mechanism ----
      - name: 'Gate V3B: execution rights at the pinned commit'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          pins = json.loads(pathlib.Path("research/external/upstream_pins.json").read_text())
          src = pins["sources"]["btc_strategy_lab"]
          lic = src["license"]
          print(f"repo   {src['repo']} @ {src['commit']}")
          print(f"license {lic.get('spdx')!r}  vendoring_authorised={lic.get('vendoring_authorised')}")
          if not lic.get("spdx"):
              print("::error::V3B_EXECUTION_RIGHTS FAIL - no recognised license at the pinned commit")
              sys.exit(1)
          if lic.get("vendoring_authorised"):
              print("::error::vendoring is not authorised; upstream stays out of the repo")
              sys.exit(1)
          print("V3B_EXECUTION_RIGHTS = PASS (execute and evaluate; do not vendor)")
          PY

      - name: Verify and materialise the pinned upstream candidate
        run: |
          set -euo pipefail
          python3 research/external/pin_upstream.py --verify --cache-dir "$RUNNER_TEMP/upstream-cache" \
            2>&1 | tee artifacts-pin.log || { mkdir -p artifacts; cp artifacts-pin.log artifacts/; exit 1; }
          rm -rf "$RUNNER_TEMP/upstream-ws"
          python3 research/external/pin_upstream.py --verify \
            --cache-dir "$RUNNER_TEMP/upstream-cache" \
            --materialize "$RUNNER_TEMP/upstream-ws" >/dev/null
          mkdir -p artifacts "$STRATEGY_DIR"
          mv artifacts-pin.log artifacts/upstream_pin_gate.log
          WS="$RUNNER_TEMP/upstream-ws/btc_strategy_lab/user_data/strategies"
          cp "$WS/EmaCross.py" "$STRATEGY_DIR/EmaCross.py"
          chmod u+w "$STRATEGY_DIR/EmaCross.py"
          echo "materialised EmaCross.py"

      - name: 'Gate: safety compatibility (read the source before running)'
        run: |
          set -euo pipefail
          python3 scripts/paper_guard.py --config freqtrade/user_data/config.paper.json.example \
            2>&1 | tee artifacts/paper_guard_with_candidate.log

      - name: 'Pin identity: strategy hash, engine version'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          identity = {
              "trial_class": "h1_qualification",
              "strategy_source": {"file": f"{os.environ['STRATEGY_DIR']}/EmaCross.py",
                                   "sha256": sha(f"{os.environ['STRATEGY_DIR']}/EmaCross.py")},
              "preregistration": {"file": "research/h1_qualification/PREREGISTRATION.md",
                                   "sha256": sha("research/h1_qualification/PREREGISTRATION.md")},
              "engine_version": os.environ["IMAGE"],
              "data_contract": "research/datasets/dataset_v2.lock.json (normalized lane)",
              "warmup_overlay": "research/datasets/warmup_overlay.lock.json",
              "code_commit": os.environ["GITHUB_SHA"],
          }
          expected = "387cf39f58d266bb63d06865a0784bc2e08676edf54f4610c7d7709bb2a95f24"
          got = identity["strategy_source"]["sha256"]
          if got != expected:
              print(f"::error::strategy sha {got} != frozen identity {expected}"); raise SystemExit(1)
          pathlib.Path("artifacts/reproduction_identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          print(json.dumps(identity, indent=2))
          print("H1_FROZEN_IDENTITY = PASS")
          PY

      - name: Create and guard the research config
        run: |
          set -euo pipefail
          cp freqtrade/user_data/config.paper.json.example freqtrade/user_data/config.json
          python3 scripts/paper_guard.py --config freqtrade/user_data/config.json
          python3 - <<'PY'
          import copy, json, pathlib
          def merge(base, overlay):
              out = copy.deepcopy(base)
              for k, v in overlay.items():
                  if k.startswith("_"):
                      continue
                  out[k] = merge(out[k], v) if isinstance(v, dict) and isinstance(out.get(k), dict) else v
              return out
          base = json.loads(pathlib.Path("freqtrade/user_data/config.paper.json.example").read_text())
          overlay = json.loads(pathlib.Path("freqtrade/user_data/config.binance-data-mirror.json.example").read_text())
          merged = merge(base, overlay)
          merged["exchange"]["pair_whitelist"] = ["BTC/USDT"]
          pathlib.Path("freqtrade/user_data/config.research.json").write_text(json.dumps(merged, indent=2) + "\n")
          print("exchange.name =", merged["exchange"].get("name"),
                "| whitelist =", merged["exchange"]["pair_whitelist"])
          PY
          python3 scripts/paper_guard.py --config freqtrade/user_data/config.research.json
          mkdir -p "$DATA_DIR" "$OVERLAY_DIR" artifacts freqtrade/user_data/backtest_results freqtrade/user_data/logs
          chmod -R a+rwX freqtrade/user_data artifacts

      - name: Restore the market-data cache
        uses: actions/cache@v4
        with:
          path: |
            dataset-cache
            overlay-data
          key: extbench-data-v1-${{ hashFiles('research/datasets/dataset_v2.lock.json') }}
          restore-keys: extbench-data-v1-

      - name: Acquire Dataset V2 and the warm-up overlay from the public archive
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR"
          if [ ! -f "$CACHE_DIR/BTC_USDT-1h.feather" ] || [ ! -f "$CACHE_DIR/ETH_USDT-1h.feather" ]; then
            python3 scripts/fetch_binance_public_data.py \
              --symbol BTCUSDT --symbol ETHUSDT --timeframe 1h --timeframe 5m \
              --start 2020-12-01 --end 2026-08-31 \
              --out-dir "$CACHE_DIR" --manifest artifacts/acquisition_dataset_v2.json
          else
            echo "Dataset V2 restored from cache"
          fi
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          cp "$CACHE_DIR"/*.feather "$DATA_DIR"/
          chmod -R a+rwX freqtrade/user_data
          if [ ! -f "$OVERLAY_DIR/BTC_USDT-1h.feather" ]; then
            python3 scripts/fetch_binance_public_data.py \
              --symbol BTCUSDT --timeframe 1h \
              --start 2020-10-01 --end 2020-11-30 \
              --out-dir "$OVERLAY_DIR" --manifest artifacts/acquisition_overlay.json
          else
            echo "overlay restored from cache"
          fi

      - name: 'Gate: data integrity against the frozen lock'
        run: |
          set -euo pipefail
          python3 scripts/audit_data.py \
            --data-dir "$DATA_DIR" \
            --pair BTC/USDT --pair ETH/USDT --timeframe 1h --timeframe 5m \
            --lock research/datasets/dataset_v2.lock.json --gate lock \
            2>&1 | tee artifacts/v4_dataset_lock_check.log

      - name: 'Gate: join the warm-up overlay under its canonical-identity gate'
        run: |
          set -euo pipefail
          python3 scripts/join_warmup_overlay.py \
            --data-dir "$DATA_DIR" --overlay-dir "$OVERLAY_DIR" \
            --lock research/datasets/dataset_v2.lock.json \
            --pair BTC/USDT --timeframe 1h \
            --first-scored-utc "$FIRST_SCORED_UTC" \
            --required-candles 1300 \
            --out artifacts/v7_warmup_join.json \
            2>&1 | tee artifacts/v7_warmup_join.log

      - name: Pull the pinned Freqtrade image
        timeout-minutes: 12
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if timeout 220 docker pull "$IMAGE"; then echo "pulled on attempt $attempt"; exit 0; fi
            echo "pull attempt $attempt failed; Docker Hub may be rate limiting"; sleep $((attempt * 20))
          done
          echo "::error::could not pull $IMAGE after 3 attempts"; exit 1

      - name: Restore ownership before the campaign starts
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" freqtrade/user_data artifacts

      - name: Run the preregistered qualification campaign (8 neighbors + 4 slices + 1 cost-stress)
        timeout-minutes: 150
        run: |
          set -euo pipefail
          python3 research/h1_qualification/run_qualification.py \
            --image "$IMAGE" --artifacts-dir artifacts/qualification

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-qualification
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
