name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy local-only values. The stack binds every port to 127.0.0.1 and the
  # exchange key/secret stay empty, so nothing here can reach a real account.
  FREQTRADE_API_USER: ci_dummy_user
  FREQTRADE_API_PASSWORD: ci_dummy_password_not_a_secret
  FREQTRADE_JWT_SECRET: ci_dummy_jwt_secret_not_a_secret
  FREQTRADE_WS_TOKEN: ci_dummy_ws_token_not_a_secret
  GRAFANA_ADMIN_USER: ci_admin
  GRAFANA_ADMIN_PASSWORD: ci_dummy_grafana_password

jobs:
  static:
    name: Static checks and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python compile check
        run: python -m compileall -q scripts research monitoring freqtrade tests

      - name: JSON validity
        run: |
          set -euo pipefail
          git ls-files '*.json' '*.json.example' | while read -r f; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok  $f"
          done

      - name: YAML validity
        run: |
          set -euo pipefail
          git ls-files '*.yml' '*.yaml' | while read -r f; do
            python -c "import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"
            echo "ok  $f"
          done

      - name: Shell script syntax
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' | while read -r f; do bash -n "$f" && echo "parsed  $f"; done
          # SC1091: _common.sh is sourced by relative path at runtime.
          git ls-files '*.sh' | xargs shellcheck --severity=warning --exclude=SC1091

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($_.Name): $($errors[0].Message)" }
            Write-Host "parsed  $($_.Name)"
          }

      - name: Deterministic repository checks
        run: python3 scripts/verify_repo.py

      - name: Paper-safety guard (fail closed)
        run: python3 scripts/paper_guard.py

      - name: Paper guard must reject an unsafe config
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("freqtrade/user_data/config.paper.json.example").read_text())
          cfg["dry_run"] = False
          cfg["trading_mode"] = "futures"
          pathlib.Path("/tmp/unsafe.json").write_text(json.dumps(cfg))
          PY
          if python3 scripts/paper_guard.py --config /tmp/unsafe.json --skip-strategies; then
            echo "::error::paper guard accepted an unsafe config"
            exit 1
          fi
          echo "paper guard correctly rejected the unsafe config"

      - name: Effective config (redacted, no secrets required)
        # Written outside the checkout: the repository checks fail on any file
        # that is neither tracked nor ignored, and that strictness is the point.
        run: |
          python3 scripts/effective_config.py > "$RUNNER_TEMP/effective-config.json"
          python3 scripts/effective_config.py --hash-only

      - name: Validate committed experiment records
        run: python3 research/record_experiment.py validate research/records/*.json

      - name: External upstream pin gate
        # Fetches every pinned candidate file from raw.githubusercontent.com at its
        # frozen commit and fails if any byte moved. This is what stops a candidate
        # being benchmarked against source other than the one that was reviewed.
        run: python3 research/external/pin_upstream.py --verify --cache-dir "$RUNNER_TEMP/upstream"

      - name: Validate the forward-paper records against their schemas
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          import jsonschema

          pairs = [
              ("research/schema/paper_candidate_admission.schema.json",
               "research/fp/records/paper_candidate_admission.json"),
              ("research/schema/forward_paper_cohort_registry.schema.json",
               "research/fp/records/forward_paper_cohort_registry.json"),
          ]
          failed = False
          for schema_path, record_path in pairs:
              schema = json.loads(pathlib.Path(schema_path).read_text())
              record = json.loads(pathlib.Path(record_path).read_text())
              errors = list(jsonschema.validators.validator_for(schema)(schema).iter_errors(record))
              if errors:
                  failed = True
                  print(f"INVALID {record_path}")
                  for err in errors:
                      print(f"  - {'/'.join(str(p) for p in err.absolute_path) or '<root>'}: {err.message}")
              else:
                  print(f"VALID   {record_path}")
          sys.exit(2 if failed else 0)
          PY

      - name: Paper admission must be BLOCKED while no candidate is admitted
        # The committed record is regenerated and compared, so it cannot drift
        # from what the evaluator actually says. An ADMITTED verdict here would
        # mean a candidate was let into forward paper before the authoritative
        # lineage was even consolidated, which is the failure this gate prevents.
        run: |
          set -euo pipefail
          python3 research/fp/admission.py evaluate -o "$RUNNER_TEMP/admission.json"
          python - <<'PY'
          import json, os, pathlib, sys
          fresh = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "admission.json").read_text())
          committed = json.loads(pathlib.Path("research/fp/records/paper_candidate_admission.json").read_text())
          if fresh["paper_admission"] != "BLOCKED":
              print("::error::paper admission is no longer BLOCKED; a candidate freeze must be reviewed")
              sys.exit(1)
          fresh_results = [c["result"] for c in fresh["conditions"]]
          committed_results = [c["result"] for c in committed["conditions"]]
          if fresh_results != committed_results:
              print("::error::the committed admission record has drifted from the evaluator")
              print(f"  committed: {committed_results}")
              print(f"  evaluated: {fresh_results}")
              sys.exit(1)
          print(f"PAPER_ADMISSION = {fresh['paper_admission']} — {fresh['reason']}")
          PY

      - name: Dataset V2 lock must not fork from main
        # TL-FP-BOOT-1 v2.0 section 2: DO NOT REACQUIRE DATASET V2. A second set
        # of authoritative hashes is a provenance fork, and a later archive
        # revision would make the two impossible to reconcile. The only legal way
        # for this file to change on a branch is by merging main, so any
        # divergence from main is either a reacquisition or a hand edit.
        run: |
          set -euo pipefail
          LOCK=research/datasets/dataset_v2.lock.json
          git fetch origin main
          BASE=$(git merge-base HEAD FETCH_HEAD)
          # Compare against the merge base, not against main's tip. A branch that
          # simply has not merged main yet is *behind*, which section 4 actively
          # requires of the parked scaffold; a branch that edited this file since
          # diverging has *forked*, which section 2 forbids. Only the second is a
          # fault, and only the merge base can tell them apart.
          if git diff --quiet "$BASE" HEAD -- "$LOCK"; then
            if git diff --quiet HEAD FETCH_HEAD -- "$LOCK"; then
              echo "dataset_v2 lock is identical to origin/main"
            else
              echo "dataset_v2 lock is unmodified on this branch; it is behind origin/main, which is not a fork"
              echo "  branch and main differ only because main has advanced:"
              git diff --stat HEAD FETCH_HEAD -- "$LOCK"
            fi
          else
            echo "::error::$LOCK was modified on this branch since it diverged from main."
            echo "::error::Section 2 forbids reacquiring or hand-editing Dataset V2; the frozen lock"
            echo "::error::reaches a branch by merge only."
            git diff --stat "$BASE" HEAD -- "$LOCK"
            exit 1
          fi

      - name: Report the section 3.1 activation gate
        # Not a failing gate: this branch is the parked scaffold and the merge is
        # a project-level decision. It is reported on every run so the blocker
        # stays visible rather than being rediscovered.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          record = json.loads(pathlib.Path("research/fp/records/paper_candidate_admission.json").read_text())
          lineage = record["authoritative_lineage"]
          state = "CONSOLIDATED" if lineage["is_ancestor_of_main"] else "NOT CONSOLIDATED"
          print(f"BASELINE_CLOSURE_COMMIT = {lineage['baseline_closure_commit']}")
          print(f"AUTHORITATIVE_LINEAGE   = {state} — {lineage['detail']}")
          print(f"ENTRY_STATE             = {record['entry_state']}")
          print(f"PAPER_ADMISSION         = {record['paper_admission']}")
          if not lineage["is_ancestor_of_main"]:
              print("::notice::TL-FP-BOOT-1 is BLOCKED at section 3.1 until the BASELINE-1 lineage is merged to main.")
          PY

      - name: FP-BOOT-1 preflight must not permit a T0
        run: |
          set -euo pipefail
          python3 research/fp/preflight.py
          if python3 research/fp/preflight.py --require-pass >/dev/null; then
            echo "::error::preflight reported PASS; creating a cohort T0 requires an explicit owner decision"
            exit 1
          fi
          echo "preflight correctly refuses a T0"

      - name: Test suite
        run: python -m pytest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effective-config
          path: ${{ runner.temp }}/effective-config.json
          if-no-files-found: warn

  compose:
    name: Compose render and exporter image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Render docker compose config with dummy local values
        run: |
          docker compose config
          docker compose config --services

      - name: Render the FP control overlay and assert it stays paper-safe
        run: |
          set -euo pipefail
          # The overlay is rendered for the instance the registry says may run,
          # resolved the same fail-closed way the launcher resolves it. Rendering
          # without a selection is now a hard failure rather than an empty lane.
          eval "$(python3 scripts/fp_instance.py FP-CONTROL-2)"
          export FP_ROLE FP_INSTANCE_DIR FP_BOT_NAME FP_DB_PATH FP_LOG_PATH FP_EVIDENCE_DIR
          docker compose -f docker-compose.yml -f docker-compose.fp.yml config > /tmp/fp-rendered.yml
          docker compose -f docker-compose.yml -f docker-compose.fp.yml config --services
          python3 -m pip install --quiet "PyYAML==6.0.3"
          python3 scripts/check_fp_overlay.py /tmp/fp-rendered.yml "$FP_ROLE"

      - name: An unselected FP overlay render must fail closed
        run: |
          set -euo pipefail
          if docker compose -f docker-compose.yml -f docker-compose.fp.yml config >/dev/null 2>&1; then
            echo "FP_OVERLAY_FAIL: the overlay rendered with no instance selected" >&2
            exit 1
          fi
          echo "FP_OVERLAY_PASS: rendering without a selected instance is refused"

      - name: Build the read-only exporter image
        run: docker build -t tradinglab-exporter:ci monitoring/exporter

      - name: Exporter starts, serves metrics, and reports the API as down
        run: |
          set -euo pipefail
          docker run -d --name exporter-ci -p 9108:9108 \
            -e FREQTRADE_URL=http://127.0.0.1:1 \
            -e EXPORTER_PORT=9108 tradinglab-exporter:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9108/metrics >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9108/metrics | tee metrics.txt | grep -E '^freqtrade_api_up' || true
          grep -q 'freqtrade_api_up 0' metrics.txt
          docker logs exporter-ci
          docker rm -f exporter-ci

  freqtrade-load:
    name: Freqtrade loads the paper config and strategy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create the runtime config from the committed example
        run: cp freqtrade/user_data/config.paper.json.example freqtrade/user_data/config.json

      - name: Guard the generated runtime config
        run: python3 scripts/paper_guard.py --config freqtrade/user_data/config.json

      - name: Strategy and config load inside the pinned Freqtrade image
        run: |
          set -euo pipefail
          IMAGE="freqtradeorg/freqtrade:2026.7"
          docker pull "$IMAGE"

          # Freqtrade exits 0 even when configuration validation fails, so the
          # exit code alone would let a broken config pass as green. Every
          # invocation is therefore checked for a validation error in its output.
          run_ft() {
            local label="$1"; shift
            echo "::group::freqtrade $label"
            if ! docker run --rm -v "$PWD/freqtrade/user_data:/freqtrade/user_data" \
                 "$IMAGE" "$@" 2>&1 | tee "/tmp/ft-$label.log"; then
              echo "::error::freqtrade $label exited non-zero"
              exit 1
            fi
            echo "::endgroup::"
            if grep -qE 'CRITICAL - Invalid configuration|Configuration error|OperationalException' \
                 "/tmp/ft-$label.log"; then
              echo "::error::freqtrade $label reported a configuration error"
              exit 1
            fi
          }

          # No trading command is issued: this only proves the config parses and
          # the strategy class imports against the pinned engine version.
          run_ft list-strategies list-strategies \
            --config /freqtrade/user_data/config.json \
            --strategy-path /freqtrade/user_data/strategies
          grep -q PlumbingSmokeStrategy /tmp/ft-list-strategies.log

          run_ft show-config show-config --config /freqtrade/user_data/config.json

          docker run --rm "$IMAGE" --version

      - name: Replay EMA matches TA-Lib inside the pinned engine image
        # fp.replay.ema is a pure-Python re-implementation, because the research
        # environment has no TA-Lib. Event-time replay is the primary parity
        # gate, so the equivalence is executed here rather than asserted.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 \
            -v "$PWD:/repo:ro" -w /repo \
            "freqtradeorg/freqtrade:2026.7" research/fp/talib_parity.py
