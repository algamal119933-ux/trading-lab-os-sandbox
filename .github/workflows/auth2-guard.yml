name: AUTH-2 pre-dispatch guard (manual dispatch only)

# AUTH-2-DISCOVERY-QUALIFICATION-1: the pre-dispatch half of research/auth2/dispatch_guard.py,
# run in Actions because the executor's session cannot read the account's Actions billing.
# It runs the guard for one node part (or CLOSURE) with the AUTH2_BILLING_TOKEN secret and
# publishes the decision record as a job annotation (.github/gates/auth2_operator.py). The
# executor dispatches .github/workflows/auth2.yml or auth2-closure.yml only after
# `auth2_operator.py check-dispatch` verifies that record: this guard run, on the current main,
# succeeded (DISPATCH), is at most 15 minutes old, and no AUTH-2 run was created after it.
#
# workflow_dispatch only. It runs no node, reads no market data, pulls no image, never commits,
# pushes or writes the trial ledger. Its billed minutes count toward the program's 4,000.
on:
  workflow_dispatch:
    inputs:
      node:
        description: "DAG node, or CLOSURE"
        type: choice
        required: true
        options: [D0, CAL-A1, CAL-A2, CAL-A3, PC-A1, PC-A2, PC-A3, N-A1, N-A2, N-A3, A1, A2, A3, HOLM,
                  SC-A1, SC-A2, SC-A3, CLOSURE]
      part:
        description: "Part of a split node (PC-A2 and N-A2 have 2; every other node 1)"
        type: choice
        required: true
        default: "1"
        options: ["1", "2"]

run-name: AUTH2-GUARD ${{ inputs.node }} part ${{ inputs.part }}

permissions:
  contents: read
  actions: read

concurrency:
  group: auth2-program
  cancel-in-progress: false

env:
  PYTHONPATH: research

jobs:
  guard:
    name: AUTH-2 guard ${{ inputs.node }} part ${{ inputs.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies (arch and its closure hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --require-hashes --no-deps -r research/auth2/requirements-auth2.txt
          pip check

      - name: 'Gate: dispatch guard (billing readable, serial, caps, never re-run), published'
        run: |
          set -euo pipefail
          python .github/gates/auth2_operator.py guard --node "$NODE" --part "$PART" \
            --repo-slug "$GITHUB_REPOSITORY" --self-run-id "$GITHUB_RUN_ID" --out out/guard.json --annotate
        env:
          NODE: ${{ inputs.node }}
          PART: ${{ inputs.part }}
          GH_TOKEN: ${{ github.token }}
          AUTH2_BILLING_TOKEN: ${{ secrets.AUTH2_BILLING_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth2guard-${{ inputs.node }}-p${{ inputs.part }}
          path: out/guard.json
          if-no-files-found: warn
          retention-days: 90
