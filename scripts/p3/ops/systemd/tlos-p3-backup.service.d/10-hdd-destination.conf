# Host-level override, 2026-10-29: the WDC NTFS disk behind /mnt/tlos-wdc is unavailable and the repo's
# scripts/p3/scheduled_backup.sh hard-codes it. Same governed tool (scripts/p3/backup.py), destination
# moved to the 3TB HDD, plus an SSD mirror of the HDD-resident runtime data. See
# /home/hamza/projects/trading/tlos-runtime/README.md. Remove this file to return to the repo unit.
[Unit]
RequiresMountsFor=
RequiresMountsFor=/srv/project-data

[Service]
ExecStart=
ExecStart=%h/projects/trading/tlos-runtime/backup.sh
