# Trading Lab OS — P3-PLN-06 alert rules (master plan §19 severities).
#
# Source metrics:
#   tlos_p3_health_check{check="…"}  0 INFO · 1 WARNING · 2 CRITICAL   (research/p3/health.py)
#   tlos_p3_health_overall            worst severity of the run          (research/p3/health.py)
#   node_textfile_mtime_seconds, node_textfile_scrape_error, up        (prometheus-node-exporter)
# The health job runs hourly (tlos-p3-health.timer). Each check keeps its own label, so a CRITICAL
# on mount:/mnt/tlos-wdc and one on timer:tlos-p2-window-fp-control-3.timer page separately.
# Validated with `promtool check rules` and `promtool test rules tlos_p3_alerts.test.yml`.
groups:
  - name: tlos-p3-health
    rules:
      - alert: TLOSHealthCritical
        expr: tlos_p3_health_check == 2
        labels:
          severity: critical
        annotations:
          summary: "TLOS health CRITICAL: {{ $labels.check }}"
          description: "P3 health check {{ $labels.check }} is CRITICAL (§19: immediate Owner attention). Read the journal: journalctl --user -u tlos-p3-health.service -n 20"

      - alert: TLOSHealthWarning
        expr: tlos_p3_health_check == 1
        labels:
          severity: warning
        annotations:
          summary: "TLOS health WARNING: {{ $labels.check }}"
          description: "P3 health check {{ $labels.check }} is WARNING."

  - name: tlos-p3-liveness
    rules:
      # The health job itself died or the timer stopped: two missed hourly runs.
      - alert: TLOSHealthTextfileStale
        expr: time() - node_textfile_mtime_seconds{file=~".*tlos_p3_health\\.prom"} > 7500
        labels:
          severity: critical
        annotations:
          summary: "TLOS health job has not written for over 2 hours"
          description: "tlos_p3_health.prom is {{ $value | humanizeDuration }} old. Check tlos-p3-health.timer."

      - alert: TLOSHealthTextfileMissing
        expr: absent(node_textfile_mtime_seconds{file=~".*tlos_p3_health\\.prom"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "TLOS health textfile is not visible to node-exporter"
          description: "No tlos_p3_health.prom in the textfile collector. Check the collector directory and permissions."

      - alert: TLOSTextfileScrapeError
        expr: node_textfile_scrape_error == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter cannot parse a textfile"
          description: "The textfile collector reports a scrape error."

      - alert: TLOSNodeExporterDown
        expr: up{job="tlos-host-node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host node-exporter is down"
          description: "Prometheus cannot scrape 127.0.0.1:9100."

  - name: tlos-p3-deadman
    rules:
      # Always firing by design. Routed only to the off-host dead-man receiver: its periodic
      # delivery proves Prometheus → Alertmanager → network is alive. When the host dies, the
      # off-host service (healthchecks.io / a remote Uptime Kuma push monitor) alerts on silence.
      - alert: TLOSWatchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "TLOS ops-plane watchdog (always firing)"
